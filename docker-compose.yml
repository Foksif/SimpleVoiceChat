services:
  # Сайт + сигналинг (Rust)
  app:
    build:
      context: .
      args:
        VITE_ICE_SERVERS: >-
          [{"urls":"stun:stun.l.google.com:19302"},
          {"urls":"turn:${SERVER_IP}:3478","username":"${TURN_USER}","credential":"${TURN_PASSWORD}"}]
    restart: unless-stopped

  # HTTPS и автоматические сертификаты Let's Encrypt
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # TURN: ретранслятор звука для тех, у кого не работает прямое P2P
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --realm=voice.elysiac.fun
      - --lt-cred-mech
      - --user=${TURN_USER}:${TURN_PASSWORD}
      - --fingerprint
      - --external-ip=${SERVER_IP}
      - --min-port=49152
      - --max-port=49252
      - --no-multicast-peers
      - --no-cli
      # не даём ходить через TURN во внутренние сети сервера
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255

volumes:
  caddy_data:
  caddy_config:
